version: "3.9"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  telegram:
    build: .
    command: ["python", "-m", "interfaces.telegram_bot"]
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    profiles: ["telegram"]

  discord:
    build: .
    command: ["python", "-m", "interfaces.discord_bot"]
    env_file: .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    profiles: ["discord"]
